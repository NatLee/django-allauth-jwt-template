{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}allauth + JWT playground{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'demo/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>allauth <span class="plus">+</span> JWT</span>
      <span class="brand-sub">playground</span>
    </a>
    <nav>{% block nav %}{% endblock %}</nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer class="footer">
    A demo page for <code>django-allauth-jwt-template</code>. Replace it with your own frontend.
  </footer>
</body>
</html>
